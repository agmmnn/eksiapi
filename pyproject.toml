[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eksiapi"
version = "0.1.0"
description = "Unofficial Python client for the Ekşi Sözlük API (reverse-engineered from Android app v2.4.4)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "curl-cffi>=0.7",
    "cryptography>=42",
    "keyring>=25,<27",
    "mcp>=2,<3",
    "pydantic>=2.10,<3",
]

[project.scripts]
eksi-auth = "eksiapi.mcp.credentials:main"
eksi-mcp = "eksiapi.mcp.server:main"

[project.urls]
Homepage = "https://github.com/agmmnn/eksiapi"

[dependency-groups]
dev = [
    "mcp[cli]>=2,<3",
    "pytest>=8,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["eksiapi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
