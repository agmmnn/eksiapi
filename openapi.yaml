openapi: 3.0.3
info:
  title: Ekşi Sözlük Mobile API (Unofficial)
  description: |-
    Unofficial HTTP API reference for Ekşi Sözlük, reverse-engineered from Android app 2.4.10 build 144. This project is not affiliated with Ekşi Teknoloji.

    ## Authentication modes

    Public reads still require an app bearer token. Use the anonymous-token flow when no user account is needed. Account reads and all writes require a logged-in account token. Secured requests send both `Authorization: Bearer <access_token>` and `Client-Secret: <uuid>`.

    ## Api-Secret

    Authentication requests include an `Api-Secret` form field containing RSA/ECB/PKCS1Padding encrypted app metadata. See the [reverse-engineering notes](https://github.com/agmmnn/eksiapi/blob/master/docs/apk-analysis.md) and [Python implementation](https://github.com/agmmnn/eksiapi/blob/master/eksiapi/auth.py).

    ## Running requests

    The generated Postman collection can create anonymous and account sessions without Python. Its authentication scripts generate `Api-Secret` and keep credentials and session values in Postman Local Vault. When using the OpenAPI contract in another client, supply `Api-Secret`, bearer-token and `Client-Secret` values yourself. Never publish or share account passwords, access tokens, refresh tokens or client secrets.

    ## Stability

    This is an unofficial reverse-engineered contract. Endpoint behavior may change when the Android application is updated. Operations marked with `x-eksi-risk` change account state or expose private account data.
  version: "2.4.10-build.144"
  contact:
    name: eksiapi
    url: https://github.com/agmmnn/eksiapi
  license:
    name: MIT
    url: https://github.com/agmmnn/eksiapi/blob/master/LICENSE
servers:
- url: https://api.eksisozluk.com
  description: Production API

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Anonymous app bearer for public reads or account bearer for private reads and writes.
    clientSecret:
      type: apiKey
      in: header
      name: Client-Secret

      description: Per-session UUID returned or created during authentication. Do not publish a real value.
  headers:
    UserAgent:
      schema:
        type: string
        example: "eksisozluk-android/144"

  schemas:
    ApiResponse:
      type: object
      properties:
        Data:
          description: Response payload (type varies per endpoint)
        Success:
          type: boolean
          example: true
        Message:
          type: string
          nullable: true
          example:
        StatusCode:
          type: integer
          example: 200

      required:
      - Success
      - Data
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          example: <account-access-token>
        token_type:
          type: string
          example: bearer
        expires_in:
          type: integer
          example: 3600
        refresh_token:
          type: string
          example: <refresh-token>
        userName:
          type: string
          example: example-user
        ".issued":
          type: string
          format: date-time
          example: '2026-08-07T12:00:00Z'
        ".expires":
          type: string
          format: date-time
          example: '2026-08-07T13:00:00Z'

    AnonymousTokenBody:
      type: object
      required: [DeviceModel, Platform, Version, Build, Api-Secret, Client-Secret, ClientUniqueId]
      properties:
        DeviceModel:
          type: string
          example: "Google sdk_gphone_x86_64"
        Platform:
          type: string
          example: "g"
        Version:
          type: string
          example: "2.4.10"
        Build:
          type: integer
          example: 144
        Api-Secret:
          type: string
          description: RSA-encrypted token generated by the SDK authentication helper.
          example: <generated-api-secret>
        Client-Secret:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-000000000000
        ClientUniqueId:
          type: string
          format: uuid
          example: 00000000-0000-4000-8000-000000000000

    LoginBody:
      allOf:
      - $ref: '#/components/schemas/AnonymousTokenBody'
      - type: object
        required: [grant_type, username, password]
        properties:
          grant_type:
            type: string
            enum: [password]
          username:
            type: string
            example: <username>
          password:
            type: string
            format: password
            example: <password>

    RefreshTokenBody:
      allOf:
      - $ref: '#/components/schemas/AnonymousTokenBody'
      - type: object
        required: [grant_type, refresh_token]
        properties:
          grant_type:
            type: string
            enum: [refresh_token]
          refresh_token:
            type: string
            example: <refresh-token>

    IdForm:
      type: object
      required: [Id]
      properties:
        Id:
          type: integer
          minimum: 1
          example: 1

    NickForm:
      type: object
      required: [nick]
      properties:
        nick:
          type: string
          minLength: 1
          example: example-user

    EntryForm:
      type: object
      required: [Title, Content]
      properties:
        Title:
          type: string
          example: example topic
        Content:
          type: string
          example: Example entry content.

    SendMessageBody:
      type: object
      required: [message, to, threadId]
      properties:
        message:
          type: string
          example: Example message.
        to:
          type: string
          example: example-user
        threadId:
          type: integer
          minimum: 0
          example: 0

    ErrorResponse:
      type: object
      required:
      - Message
      properties:
        Success:
          type: boolean
          example: false
        Message:
          type: string
          example: Invalid request.
        Data:
          nullable: true
        StatusCode:
          type: integer
          example: 400
    EntryAuthor:
      type: object
      required:
      - Nick
      - Id
      properties:
        Nick:
          type: string
          example: example-user
        Id:
          type: integer
          example: 42
    Entry:
      type: object
      required:
      - Id
      - Content
      - Author
      - Created
      properties:
        Id:
          type: integer
          example: 1
        Content:
          type: string
          example: Example entry content.
        Author:
          $ref: '#/components/schemas/EntryAuthor'
        Created:
          type: string
          format: date-time
          example: '2026-08-07T12:00:00Z'
        LastUpdated:
          type: string
          format: date-time
          nullable: true
          example:
        IsFavorite:
          type: boolean
          example: false
        FavoriteCount:
          type: integer
          example: 0
        LikeCount:
          type: integer
          example: 0
        CommentCount:
          type: integer
          example: 0
        AvatarUrl:
          type: string
          format: uri
          example: https://example.com/avatar.png
    TopicIndexItem:
      type: object
      required:
      - TopicId
      - Title
      - MatchedCount
      - FullCount
      properties:
        Day:
          type: string
          nullable: true
        MatchedCount:
          type: integer
          example: 24
        TopicId:
          type: integer
          example: 123
        FullCount:
          type: integer
          example: 1888
        Title:
          type: string
          example: example topic
    Channel:
      type: object
      required:
      - Id
      - Name
      - DisplayName
      - IsPublic
      properties:
        Id:
          type: integer
          example: 1
        Name:
          type: string
          example: gundem
        DisplayName:
          type: string
          example: Gündem
        Description:
          type: string
          example: Example channel description.
        Priority:
          type: integer
          example: 1
        IsPublic:
          type: boolean
          example: true
    EntryTopicResponse:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        properties:
          Data:
            type: object
            required:
            - Id
            - Title
            - Entries
            - PageCount
            - PageSize
            - PageIndex
            properties:
              Id:
                type: integer
                example: 1
              Title:
                type: string
                example: example topic
              Entries:
                type: array
                items:
                  $ref: '#/components/schemas/Entry'
              PageCount:
                type: integer
                example: 1
              PageSize:
                type: integer
                example: 10
              PageIndex:
                type: integer
                example: 1
    TopicListResponse:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        properties:
          Data:
            type: object
            required:
            - Topics
            - PageCount
            - PageSize
            - PageIndex
            properties:
              Topics:
                type: array
                items:
                  $ref: '#/components/schemas/TopicIndexItem'
              PageCount:
                type: integer
                example: 1
              PageSize:
                type: integer
                example: 50
              PageIndex:
                type: integer
                example: 1
    ChannelListResponse:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        properties:
          Data:
            type: object
            required:
            - AllChannels
            properties:
              AllChannels:
                type: array
                items:
                  $ref: '#/components/schemas/Channel'
    UserIdentifier:
      type: object
      required:
      - Nick
      - Id
      properties:
        Nick:
          type: string
          example: agmmnn
        Id:
          type: integer
          example: 42
    UserProfileResponse:
      allOf:
      - $ref: '#/components/schemas/ApiResponse'
      - type: object
        properties:
          Data:
            type: object
            required:
            - UserInfo
            - FollowerCount
            - FollowingsCount
            properties:
              UserInfo:
                type: object
                properties:
                  UserIdentifier:
                    $ref: '#/components/schemas/UserIdentifier'
                  IsCaylak:
                    type: boolean
                    example: false
                  IsBuddy:
                    type: boolean
                    example: false
                  IsBlocked:
                    type: boolean
                    example: false
                  IsFollowed:
                    type: boolean
                    example: false
              Badges:
                type: array
                items:
                  type: object
              ImageBadges:
                type: array
                items:
                  type: object
              FollowerCount:
                type: integer
                example: 0
              FollowingsCount:
                type: integer
                example: 0
              Picture:
                type: string
                format: uri
                nullable: true
                example: https://example.com/avatar.png
              PinnedEntry:
                nullable: true
              Biograpyh:
                type: string
                nullable: true
                example: Example biography.
  responses:
    BadRequest:
      description: The request body or parameters are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            Success: false
            Message: Invalid request.
            Data:
            StatusCode: 400
    Unauthorized:
      description: The bearer token, Client-Secret or authentication flow is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            Success: false
            Message: Authorization has been denied for this request.
            Data:
            StatusCode: 401
    Forbidden:
      description: The logged-in account cannot perform this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            Success: false
            Message: This operation is not allowed for the account.
            Data:
            StatusCode: 403
    NotFound:
      description: The requested topic, entry, user or account object was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            Success: false
            Message: The requested resource was not found.
            Data:
            StatusCode: 404
    RateLimited:
      description: The upstream API rate limit was reached.
      headers:
        Retry-After:
          description: Seconds to wait before another safe read.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            Success: false
            Message: Too many requests.
            Data:
            StatusCode: 429
  parameters:
    ClientSecretHeader:
      name: Client-Secret
      in: header
      required: true
      description: Per-session client UUID. Use a local Postman variable and never publish a real value.
      schema:
        type: string
        format: uuid
      example: '{{clientSecret}}'
security:
- bearerAuth: []
  clientSecret: []

paths:

  # ── Authentication ──────────────────────────────────────────────────────────

  /v2/clientsettings/time:
    get:
      tags:
      - Authentication
      summary: Get server timestamp
      operationId: getServerTimestamp
      description: Returns current server time in milliseconds. Required as input for Api-Secret generation. This endpoint does not require a bearer token.
      x-eksi-auth-mode: none
      security: []
      responses:
        '200':
          description: Server timestamp
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    Data:
                      type: integer
                      example: 1774216389918

  /v2/account/anonymoustoken:
    post:
      tags:
      - Authentication
      summary: Get anonymous bearer token
      operationId: getAnonymousBearerToken
      description: Obtain an anonymous bearer token for public reads or as the first step of account login. This endpoint does not require an existing bearer token, but the generated Client-Secret must be sent in the header and form body.
      x-eksi-auth-mode: authentication-flow
      security: []
      parameters:
      - $ref: '#/components/parameters/ClientSecretHeader'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AnonymousTokenBody'
      responses:
        '200':
          description: Anonymous token
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    Data:
                      type: object
                      properties:
                        AccessToken:
                          type: string
                        ExpiresIn:
                          type: integer

              example:
                Success: true
                Message:
                Data:
                  AccessToken: <anonymous-access-token>
                  ExpiresIn: 3600
        '400':
          $ref: '#/components/responses/BadRequest'
  /token:
    post:
      tags:
      - Authentication
      summary: Login with credentials
      operationId: loginWithCredentials
      description: |-
        Full login. Requires an anonymous Bearer token in the Authorization header (obtained from /v2/account/anonymoustoken). Returns access_token and other OAuth fields. An anonymous bearer token and Client-Secret header are required before exchanging account credentials or a refresh token.
      x-eksi-auth-mode: authentication-flow
      security:
      - bearerAuth: []
        clientSecret: []
      parameters:
      - $ref: '#/components/parameters/ClientSecretHeader'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
              - $ref: '#/components/schemas/LoginBody'
              - $ref: '#/components/schemas/RefreshTokenBody'
      responses:
        '200':
          description: Access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'

  # ── User ────────────────────────────────────────────────────────────────────

              example:
                access_token: <account-access-token>
                token_type: bearer
                expires_in: 3600
                refresh_token: <refresh-token>
                userName: example-user
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v2/user/isdeveloper:
    get:
      tags:
      - Profiles
      summary: Check if current user has developer status
      operationId: checkIfCurrentUserHasDeveloperStatus
      description: Check if current user has developer status. A logged-in account bearer token and the Client-Secret header are required.
      x-eksi-auth-mode: account
      parameters:
      - $ref: '#/components/parameters/ClientSecretHeader'
      responses:
        '200':
          description: Developer status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v2/user/{nick}:
    get:
      tags:
      - Profiles
      summary: Public profile for any user
      operationId: getUserProfile
      description: Public profile for any user. An anonymous or account bearer token and the Client-Secret header are required.
      x-eksi-auth-mode: anonymous
      parameters:
      - name: nick
        in: path
        required: true
        schema:
          type: string
        example: agmmnn
        description: Ekşi Sözlük nickname.
      - $ref: '#/components/parameters/ClientSecretHeader'
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
              example:
                Success: true
                Message:
                Data:
                  UserInfo:
                    UserIdentifier:
                      Nick: agmmnn
                      Id: 42
                    IsCaylak: false
                    IsBuddy: false
                    IsBlocked: false
                    IsFollowed: false
                  Badges: []
                  ImageBadges: []
                  FollowerCount: 10
                  FollowingsCount: 5
                  Picture:
                  PinnedEntry:
                  Biograpyh: ''
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
  /v2/user/{nick}/entries:
    get:
      tags:
      - Profiles
      summary: Entries authored by a user
      operationId: listUserEntries
      description: Entries authored by a user. An anonymous or account bearer token and the Client-Secret header are required.
      x-eksi-auth-mode: anonymous
      parameters:
      - name: nick
        in: path
        required: true
        schema:
          type: string
        description: Ekşi Sözlük nickname.
        example: agmmnn
      - name: p
        in: query
        schema:
          type: integer
          default: 1
        description: Page number
        example: 1
      - $ref: '#/components/parameters/ClientSecretHeader'
      responses:
        '200':
          description: Paginated entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
  /v2/user/{nick}/favorites:
    get:
      tags:
      - Profiles
      summary: Entries favorited by a user
      operationId: listUserFavorites
      description: Entries favorited by a user. An anonymous or account bearer token and the Client-Secret header are required.
      x-eksi-auth-mode: anonymous
      parameters:
      - name: nick
        in: path
        required: true
        schema:
          type: string
        description: Ekşi Sözlük nickname.
        example: agmmnn
      - name: p
        in: query
        schema:
          type: integer
          default: 1
        description: Page number starting at 1.
        example: 1
      - $ref: '#/components/parameters/ClientSecretHeader'
      responses:
        '200':
          description: Paginated favorites
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ── Entries ─────────────────────────────────────────────────────────────────

        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
  /v2/entry/{id}:
    get:
      tags:
      - Entries
      summary: Single entry by ID
      operationId: getEntry
      description: Single entry by ID. An anonymous or account bearer token and the Client-Secret header are required.
      x-eksi-auth-mode: anonymous
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 1
        description: Positive entry or account object identifier.
      - $ref: '#/components/parameters/ClientSecretHeader'
      responses:
        '200':
          description: Entry data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryTopicResponse'
              example:
                Success: true
                Message:
                Data:
                  Id: 1
                  Title: pena
                  Entries:
                  - Id: 1
                    Content: Example entry content.
                    Author:
                      Nick: example-user
                      Id: 42
                    Created: '2004-02-15T00:00:00Z'
                    IsFavorite: false
                    FavoriteCount: 0
                    LikeCount: 0
                    CommentCount: 0
                  PageCount: 1
                  PageSize: 10
                  PageIndex: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
  /v2/index/olay/:
    get:
      tags:
      - Entries
      summary: Agenda entries
      operationId: listAgendaEntries
      description: Agenda entries. A logged-in account bearer token and the Client-Secret header are required.
      x-eksi-auth-mode: account
      parameters:
      - name: p
        in: query
        schema:
          type: integer
          default: 1
        description: Page number starting at 1.
        example: 1
      - $ref: '#/components/parameters/ClientSecretHeader'
      responses:
        '200':
          description: Agenda entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ── Index / Trending ────────────────────────────────────────────────────────

        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v2/index/popular:
    post:
      tags:
      - Feeds
      summary: Popular topics
      operationId: listPopularTopics
      description: Returns popular topics, optionally filtered by channels. An anonymous or account bearer token and the Client-Secret header are required.
      x-eksi-auth-mode: anonymous
      parameters:
      - name: p
        in: query
        schema:
          type: integer
          default: 1
        description: Page number starting at 1.
        example: 1
      - $ref: '#/components/parameters/ClientSecretHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Filters:
                  type: array
                  items:
                    type: string
                  description: Channel filter IDs (empty array for all)
                  example: []
      responses:
        '200':
          description: Popular topics list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicListResponse'
              example:
                Success: true
                Message:
                Data:
                  Topics:
                  - Day:
                    MatchedCount: 12
                    TopicId: 456
                    FullCount: 250
                    Title: popular example
                  PageCount: 1
                  PageSize: 50
                  PageIndex: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v2/index/today:
    get:
      tags:
      - Feeds
      summary: Today's topics (gündem)
      operationId: listTodayTopics
      description: Today's topics (gündem). An anonymous or account bearer token and the Client-Secret header are required.
      x-eksi-auth-mode: anonymous
      parameters:
      - name: p
        in: query
        schema:
          type: integer
          default: 1
        description: Page number starting at 1.
        example: 1
      - $ref: '#/components/parameters/ClientSecretHeader'
      responses:
        '200':
          description: Today's topic list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicListResponse'
              example:
                Success: true
                Message:
                Data:
                  Topics:
                  - Day: '2026-08-07'
                    MatchedCount: 24
                    TopicId: 123
                    FullCount: 1888
                    Title: example topic
                  PageCount: 1
                  PageSize: 50
                  PageIndex: 1
                  HasPinnedIndexItem: false
                  PinnedIndexItem:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v2/index/getfilterchannels:
    get:
      tags:
      - Feeds
      summary: Available filter channels for popular feed
      operationId: listPopularFeedChannels
      description: Available filter channels for popular feed. An anonymous or account bearer token and the Client-Secret header are required.
      x-eksi-auth-mode: anonymous
      parameters:
      - $ref: '#/components/parameters/ClientSecretHeader'
      responses:
        '200':
          description: Channel list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v2/index/search/:
    post:
      tags:
      - Topics
      summary: Search topic titles
      operationId: searchTopics
      description: Searches topic titles using the Android app's index search.
      x-eksi-auth-mode: anonymous
      parameters:
      - name: p
        in: query
        schema:
          type: integer
          default: 1
          minimum: 1
      - $ref: '#/components/parameters/ClientSecretHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
