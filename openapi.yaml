externalDocs:
  description: Python SDK, MCP server and reverse-engineering notes
  url: https://github.com/agmmnn/eksiapi
tags:
- name: Authentication
  description: Server time, anonymous app tokens, account login and token refresh.
- name: Feeds
  description: Today, popular, agenda, channel and personalized discovery feeds.
- name: Topics
  description: Topic search, autocomplete, metadata and follow state.
- name: Entries
  description: Entry reads, searches, publication, editing, reactions and authoring actions.
- name: Profiles
  description: Public profiles, authored content, badges, images, biography and pinned entries.
- name: Comments
  description: Entry comments and comment reactions.
- name: Relationships
  description: Followers, buddies, blocks, mutes and index-title visibility controls.
- name: Messages
  description: Private message threads, archives and delivery actions for logged-in accounts.
- name: Drafts
  description: Create, update and delete entry drafts.
- name: Settings and devices
  description: Account preferences, channel filters, subscription state and push-notification devices.
- name: Notifications
  description: Notification counts and recent account notifications.
- name: Trash
  description: Deleted entries, restoration and permanent removal.
